<title>Lejligheden er udlejet · Doka Ejendomme</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://dokaejendomme.dk/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 62 40'%3E%3Cpath d='M5 38 V21 L19 9 L33 21 V38' stroke='%23ee8a43' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23 38 V24 L42 6 L58 22' stroke='%23ee8a43' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --orange: #ee8a43; --orange-dyb: #c8622a; --ink: #1d1b19; --ink-2: #5d5853; --creme: #faf6f0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--creme); color: var(--ink); font-family: "DM Sans", Arial, sans-serif; font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  h1 { font-weight: 500; letter-spacing: -0.035em; margin: 0 0 18px; font-size: clamp(40px, 7vw, 72px); line-height: 1.02; }
  em.serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: var(--orange-dyb); }
  .smaa { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange-dyb); margin: 0 0 14px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo svg { width: 44px; height: 30px; display: block; }
  .logo b { font-weight: 800; letter-spacing: 0.04em; font-size: 20px; }
  .logo span { font-weight: 500; color: var(--ink-2); font-size: 20px; }
  .top .wrap { display: flex; align-items: center; height: 78px; }
  main { padding-top: 64px; padding-bottom: 96px; }
  main .tekst { max-width: 640px; }
  main p { color: var(--ink-2); margin: 0 0 28px; }
  .knapper { display: flex; flex-wrap: wrap; gap: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 16px 28px; border-radius: 999px; font: 700 17px "DM Sans", Arial, sans-serif; text-decoration: none; transition: transform .25s, background .25s, color .25s; }
  .pill.orange { background: var(--orange); color: var(--ink); }
  .pill.orange:hover { background: var(--ink); color: #fff; transform: translateY(-2px); }
  .pill.kant { border: 2px solid var(--ink); }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } main { padding-top: 40px; padding-bottom: 64px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="./" aria-label="DOKA Ejendomme, forsiden">
      <svg viewBox="0 0 62 40" fill="none" aria-hidden="true">
        <path d="M5 38 V21 L19 9 L33 21 V38" stroke="#ee8a43" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 38 V24 L42 6 L58 22" stroke="#ee8a43" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>DOKA</b><span>Ejendomme</span>
    </a>
  </div>
</header>
<main class="wrap">
  <div class="tekst">
    <p class="smaa">Fremvisning</p>
    <h1>Lejligheden er <em class="serif">udlejet.</em></h1>
    <p>Tak for interessen. Lejligheden i stuen på Hovedgaden 70 er udlejet, så der er ingen fremvisninger lige nu. Skriv gerne til os alligevel, så gemmer vi din henvendelse, til der bliver noget ledigt.</p>
    <div class="knapper">
      <a class="pill orange" href="./#kontakt">Skriv til os <span aria-hidden="true">→</span></a>
      <a class="pill kant" href="./">Se huset</a>
    </div>
  </div>
</main>
</body>
</html>
